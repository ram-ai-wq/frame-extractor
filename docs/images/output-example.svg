<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Frame extraction output example</title>
  <desc id="desc">An illustrative contact sheet with six sample frame thumbnails alongside the output folder containing timestamped frames, contact sheets, and an index CSV.</desc>
  <defs>
    <linearGradient id="banner" x1="0" x2="1">
      <stop offset="0" stop-color="#18324f"/>
      <stop offset="1" stop-color="#205d68"/>
    </linearGradient>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { fill: #fff; font-size: 23px; font-weight: 700; }
      .sub { fill: #d3e0eb; font-size: 13px; }
      .label { fill: #203950; font-size: 14px; font-weight: 700; }
      .detail { fill: #687d90; font-size: 12px; }
      .mono { fill: #40586d; font: 11px Consolas, "SFMono-Regular", monospace; }
      .panel { fill: #fff; stroke: #d6e0e9; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1120" height="460" rx="18" fill="#f3f6fa"/>
  <rect width="1120" height="82" rx="18" fill="url(#banner)"/>
  <path d="M0 64 Q560 100 1120 64 V82 Q1120 82 1102 82 H18 Q0 82 0 64Z" fill="url(#banner)"/>
  <text x="34" y="38" class="title">From video to review-ready files</text>
  <text x="34" y="61" class="sub">Illustrative output: timestamps, a visual overview, and a searchable index.</text>

